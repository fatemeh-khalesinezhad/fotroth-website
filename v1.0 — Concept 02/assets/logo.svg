<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fotroth-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE2638" />
      <stop offset="50%" stop-color="#E21B2C" />
      <stop offset="100%" stop-color="#B8101F" />
    </linearGradient>
  </defs>
  <!-- Official FOTROTH Circle Emblem -->
  <circle cx="50" cy="50" r="50" fill="url(#fotroth-red-grad)" />
  
  <!-- Stylized F / Viewfinder Crop Emblem -->
